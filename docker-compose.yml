services:
  backend:
    image: ssszw/tripgenie-backend:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      UV_CACHE_DIR: /opt/uv-cache
    volumes:
      - tripgenie-data:/app/backend/app/data
      - tripgenie-logs:/app/backend/logs
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ssszw/tripgenie-frontend:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  tripgenie-data:
  tripgenie-logs:
